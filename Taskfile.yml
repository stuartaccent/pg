version: '3'

vars:
  # The Tailwind standalone CLI, fetched into tmp for this system.
  TAILWIND: tmp/tailwindcss{{exeExt}}
  TAILWIND_ASSET: tailwindcss-{{if eq OS "darwin"}}macos{{else}}{{OS}}{{end}}-{{if eq ARCH "amd64"}}x64{{else}}{{ARCH}}{{end}}{{exeExt}}

tasks:
  run:
    desc: Run the desktop app
    cmds:
      - go run ./cmd/pgide

  bundle:
    desc: Build dist/pg.app on macOS, or dist/pg.exe on Windows
    cmds:
      - cmd: scripts/bundle.sh
        platforms: [darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
        platforms: [windows]

  installer:
    desc: Build dist/pg.exe and its installer on Windows (needs NSIS)
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Installer

  dev:
    desc: Serve the UI on http://127.0.0.1:8080, regenerating templ and CSS as they change
    deps: [tailwind]
    cmds:
      - task: dev-parallel

  dev-parallel:
    internal: true
    deps: [templ-watch, css-watch, serve]

  templ-watch:
    internal: true
    cmds:
      - go tool templ generate --watch

  css-watch:
    internal: true
    cmds:
      - '{{.TAILWIND}} -i web/css/app.css -o web/static/app.css --minify --watch=always'

  serve:
    internal: true
    cmds:
      - go run ./cmd/dev

  generate:
    desc: Regenerate the templ views, CSS and JS bundle
    deps: [tailwind]
    cmds:
      - go tool templ generate
      - '{{.TAILWIND}} -i web/css/app.css -o web/static/app.css --minify'
      - npm ci
      - npm run build

  test:
    desc: Run the Go and JS tests (set PGIDE_TEST_SERVICE for the ones that need a server)
    cmds:
      - go test -race ./...
      - npm test

  tailwind:
    desc: Fetch the Tailwind standalone CLI into tmp
    status:
      - test -f {{.TAILWIND}}
    cmds:
      - mkdir -p tmp
      - curl -fsSLo {{.TAILWIND}} https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/{{.TAILWIND_ASSET}}
      - cmd: chmod +x {{.TAILWIND}}
        platforms: [darwin, linux]
