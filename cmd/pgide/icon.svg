<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33639a"/>
      <stop offset="1" stop-color="#2b5684"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  </g>
  <!-- A database cylinder with a shell prompt on its face: Postgres, plus the psql tab. -->
  <path fill="#f2f5f8" d="M262 330V690A250 80 0 0 0 762 690V330Z"/>
  <ellipse cx="512" cy="330" rx="250" ry="80" fill="#c9d8e7"/>
  <g fill="none" stroke="#2f5d8a" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="384,500 464,560 384,620"/>
    <line x1="510" y1="622" x2="640" y2="622"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
